<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Motorola SDM660 Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101b33"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <!-- SoC chip -->
  <g transform="translate(980 180)">
    <g stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <path d="M-60 -98v-22M-30 -98v-22M0 -98v-22M30 -98v-22M60 -98v-22"/>
      <path d="M-60 98v22M-30 98v22M0 98v22M30 98v22M60 98v22"/>
      <path d="M-98 -60h-22M-98 -30h-22M-98 0h-22M-98 30h-22M-98 60h-22"/>
      <path d="M98 -60h22M98 -30h22M98 0h22M98 30h22M98 60h22"/>
    </g>
    <rect x="-98" y="-98" width="196" height="196" rx="22" fill="#0f172a" stroke="#60a5fa" stroke-width="4"/>
    <rect x="-70" y="-70" width="140" height="140" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">SDM</text>
    <text x="0" y="34" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#7dd3fc">660</text>
  </g>

  <text x="80" y="140" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="#f8fafc">Motorola SDM660</text>
  <text x="80" y="200" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="#7dd3fc">Platform</text>
  <text x="82" y="254" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#94a3b8">Android 17 · Linux 4.19 · sdm630 / sdm636 / sdm660</text>
  <rect x="82" y="282" width="120" height="6" rx="3" fill="#60a5fa"/>
